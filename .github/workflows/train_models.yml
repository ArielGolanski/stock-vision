name: Train and Update ML Models

on:
  schedule:
    - cron: "0 0 * * *"  # every 24h
  workflow_dispatch:  # allows manual run too

# Allow push to remote repository
permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ml/notebooks
    steps:
      # Free Disk space to be able download all requirements 
      # The virtual environment of GitHub has a lot of installed apps, so we will remove the unnecessary ones.
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Add cache to accelerate future runs
          cache: "pip"
        
      # Install PyTorch CPU seperately
      # --no-cache-dir to prevent save cache
      - name: Install Pytorch (CPU only)
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu --no-cache-dir
      
      - name: Install other dependencies
        run: pip install -r ../requirements-lite.txt --no-cache-dir

      - name: Fetch fresh data
        run: python ../fetch_data.py

      - name: Fetch Reddit sentiment
        run: python ../fetch_news.py

      - name: Run notebook
        run: papermill Models_Daily_Monthly.ipynb Models_Daily_Monthly.ipynb

      # Configure git
      # Commit must has username and email
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Push to remote
        run: |
          git add --all
          git commit -m "Update models"
          git push
       