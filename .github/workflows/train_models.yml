name: Train and Update ML Models

on:
  schedule:
    - cron: "0 0 * * *"  # every 24h
  workflow_dispatch:  # allows manual run too

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ml
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notebook
        run: papermill notebooks/Models_Daily_Monthly.ipynb notebooks/Models_Daily_Monthly.ipynb