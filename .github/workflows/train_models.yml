name: Train and Update ML Models

on:
  schedule:
    - cron: "0 0 * * *"  # every 24h
  workflow_dispatch:  # allows manual run too

# Allow push to remote repository
permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ml/notebooks
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ../requirements-lite.txt

      - name: Fetch fresh data
        run: python ../fetch_data.py

      - name: Fetch Reddit sentiment
        run: python ../fetch_news.py

      - name: Run notebook
        run: papermill Models_Daily_Monthly.ipynb Models_Daily_Monthly.ipynb

      # Configure git
      # Commit must has username and email
      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Push to remote
        run: |
          git add --all
          git commit -m "Update models"
          git push
       